name: Build, Push, Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ GHCR exige du lowercase dans le nom du repo d'image
      - name: Lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ===== API =====
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/airb-n-bark-api:latest
            ghcr.io/${{ env.OWNER_LC }}/airb-n-bark-api:${{ github.sha }}

      # ===== WEB =====
      - name: Build & push WEB
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_USE_API=${{ vars.VITE_USE_API }}
            VITE_WOOBOT_URL=${{ vars.VITE_WOOBOT_URL }}
            VITE_STRIPE_PUBLISHABLE_KEY=${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/airb-n-bark-web:latest
            ghcr.io/${{ env.OWNER_LC }}/airb-n-bark-web:${{ github.sha }}

      # ===== WOOBOT =====
      - name: Build & push WOOBOT
        uses: docker/build-push-action@v6
        with:
          context: ./apps/woobot
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/airb-n-bark-woobot:latest
            ghcr.io/${{ env.OWNER_LC }}/airb-n-bark-woobot:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Install & connect Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTHKEY }} --hostname gha-airbnbark --ssh=false
          tailscale status

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.SERVER_PATH }}

            # Versions (debug)
            docker --version
            docker compose version

            # Pull + restart
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

            # (Optionnel) clean images dangling
            docker image prune -f