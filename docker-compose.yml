services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # init.sql removed - Prisma handles schema and seeding
    ports:
      - "${DB_EXTERNAL_PORT}:5432"

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      PORT: ${API_PORT}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      - db
    ports:
      - "${API_PORT}:${API_PORT}"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_USE_API: ${VITE_USE_API}
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:5173"

  # woobot:
  #   build: ./apps/woobot
  #   restart: unless-stopped
  #   environment:
  #     PORT: 4000
  #   ports:
  #     - "4000:4000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${CADDY_PORT}:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
    depends_on:
      - api
      - web

  redis:
    image: redis:8.4.0-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    depends_on:
      - db

volumes:
  pgdata:
